[project]
name = "usched"
version = "0.1.0"
description = "High-performance USC schedule optimizer and degree audit advisor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.28.0",
  "playwright>=1.49.0",
  "absl-py>=2.1.0",
]

[project.scripts]
catalog = "server.catalog:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[dependency-groups]
dev = ["ruff>=0.8.0", "basedpyright>=1.20.0", "pytest>=8.3.0"]

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
